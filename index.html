<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Multi Cloud — 인터랙티브 멀티클라우드 코스</title>
    <meta name="description" content="AWS · Azure · GCP · NCP, Docker, Kubernetes, Terraform, CI/CD까지. 개념 하나하나를 단계별로 움직이는 아이소메트릭 다이어그램으로 배우는 멀티클라우드 플랫폼 코스." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f1e9dc" />
    <script>
      // apply a saved dark theme before the first paint, so the page never flashes light
      try {
        if (JSON.parse(localStorage.getItem('mcd:theme')) === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 560px; margin: 15vh auto; padding: 0 24px; font: 15px/1.6 ui-monospace, Menlo, monospace">
        <h1 style="font-size: 22px">Multi Cloud</h1>
        <p>단계별로 움직이는 다이어그램으로 배우는 멀티클라우드 코스입니다. 실행하려면 JavaScript가 필요합니다.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
